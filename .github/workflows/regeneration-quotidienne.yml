name: Regeneration quotidienne du wiki
# Tourne chez GitHub (aucun appareil personnel requis). Regenere les documents derives a partir du depot,
# detecte les changements de job-i.fr, puis propose le resultat dans une Pull Request a relire et fusionner.
# Lancement manuel possible : onglet Actions > "Regeneration quotidienne du wiki" > Run workflow.
on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC (06:00 a Paris en hiver, 07:00 en ete)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerer (job-i, verifications, comparaisons, manques, evaluations)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ./scripts/Check-JobIUpdates.ps1           # code 10 = changements sur job-i.fr (pas une erreur)
          Write-Output "Check-JobIUpdates : code $LASTEXITCODE"
          ./scripts/Run-All.ps1 -SansConversion      # pas d'exports ACS dans le depot : la conversion est faite sur un poste local
          exit 0

      - name: Proposer les changements par Pull Request (seulement s'il y a du fond)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # Ignore les simples changements de date de generation.
          git add -A
          SUBSTANCE=$(git diff --cached -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE 'Genere le|Verifie le|Derniere mise a jour|Dernière mise à jour' || true)
          if [ -z "$SUBSTANCE" ]; then
            echo "Aucun changement de fond : rien a proposer."
            exit 0
          fi
          BR="auto/regeneration-$(date -u +%Y%m%d)"
          git config user.name  "wiki-ibmi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git commit -m "Regeneration automatique $(date -u +%F)"
          git push origin "$BR" || { echo "Branche $BR deja presente : non poussee."; exit 0; }
          gh pr create --base main --head "$BR" \
            --title "Regeneration automatique $(date -u +%F)" \
            --body "Regeneration quotidienne : documents derives, detection des changements de job-i.fr (voir docs/JOBI-CHANGES.md), evaluations et manques. A relire, puis fusionner (le proprietaire peut le faire depuis n'importe quel appareil)." \
            || echo "Pull Request non creee (activer Settings > Actions > General > Allow GitHub Actions to create pull requests) : la branche $BR est poussee."
